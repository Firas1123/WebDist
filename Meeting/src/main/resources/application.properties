# ----------------------------------------
# General Application Settings
# ----------------------------------------
spring.application.name=MsMeeting
server.port=8086

# ----------------------------------------
# Database Configuration
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://mysql:3306/projetdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# ----------------------------------------
# Eureka Client (Optional: Enable if Eureka is running)
# ----------------------------------------
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true

# ----------------------------------------
# Actuator Endpoints
# ----------------------------------------
management.endpoints.web.exposure.include=refresh

# ----------------------------------------
# Config Server - Disabled for now (you haven’t set it up yet)
# ----------------------------------------
spring.cloud.config.fail-fast=false
# spring.config.import=optional:configserver:http://localhost:8888

spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://localhost:8889
welcome.message=welcome to Meeting ms
